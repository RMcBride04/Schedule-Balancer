<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useCallback,useMemo,useEffect,useRef}=React;


const WEEKS = 6;
const TD = WEEKS * 7;
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DNF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const TGT = 8;
const MN = 7;
const OFF = 0;
const ON = 1;
const UNA = 2;
const LCK = 3;

function mkWS(n) {
  return Array.from({ length: n }, () =>
    Array.from({ length: TD }, (_, d) => (d % 7 === 0 || d % 7 === 6) ? LCK : OFF)
  );
}

function ds(s, d) {
  if (!s) return "";
  const dt = new Date(s + "T00:00:00");
  dt.setDate(dt.getDate() + d);
  return (dt.getMonth() + 1) + "/" + dt.getDate();
}

function dType(d) {
  const w = d % 7;
  if (w === 1) return "monday";
  if (w === 5) return "friday";
  if (w === 0 || w === 6) return "weekend";
  return "midweek";
}

function isW(d) { return d % 7 === 0 || d % 7 === 6; }
function isActive(v) { return v === ON || v === LCK; }

function gStats(sh) {
  return {
    total: sh.filter(isActive).length,
    mon: sh.filter((v, i) => isActive(v) && dType(i) === "monday").length,
    fri: sh.filter((v, i) => isActive(v) && dType(i) === "friday").length,
    wknd: sh.filter((v, i) => isActive(v) && dType(i) === "weekend").length
  };
}

// Shift categories: { label, shifts, mon, fri, wknd }
const CATS = {
  full: { label: "Full-time", shifts: 18, mon: 3, fri: 3, wknd: 1 },
  part: { label: "Part-time", shifts: 12, mon: 2, fri: 2, wknd: 1 },
  prn:  { label: "PRN", shifts: 0, mon: 0, fri: 0, wknd: 0 }, // custom - shifts field is ignored, uses actual count
  leave:{ label: "Leave", shifts: 0, mon: 0, fri: 0, wknd: 0 }
};

function getReq(nurse) {
  const cat = CATS[nurse.cat || "full"];
  if (nurse.cat === "prn") {
    // PRN: use custom target if set, otherwise no requirements
    const t = nurse.prnTarget || 0;
    return { shifts: t, mon: Math.max(1, Math.round(t * 3 / 18)), fri: Math.max(1, Math.round(t * 3 / 18)), wknd: t >= 6 ? 1 : 0 };
  }
  return { shifts: cat.shifts, mon: cat.mon, fri: cat.fri, wknd: cat.wknd };
}

function chkReq(s, nurse) {
  const req = nurse ? getReq(nurse) : { shifts: 18, mon: 3, fri: 3, wknd: 1 };
  if (req.shifts === 0) return []; // leave or 0-target PRN — no requirements
  const r = [];
  if (s.total !== req.shifts) r.push("Shifts:" + s.total + "/" + req.shifts);
  if (s.mon < req.mon) r.push("Mon:" + s.mon + "/" + req.mon);
  if (s.fri < req.fri) r.push("Fri:" + s.fri + "/" + req.fri);
  if (s.wknd < req.wknd) r.push("Wknd:" + s.wknd + "/" + req.wknd);
  return r;
}

function headOn(h, d) { return h.some(x => x.shifts[d]); }

function allOn(f, w, d) {
  let c = 0;
  for (let i = 0; i < f.length; i++) { if (isActive(f[i][d])) c++; }
  for (let i = 0; i < w.length; i++) { if (isActive(w[i][d])) c++; }
  return c;
}

// Score how "bad" a nurse's requirements deviation is (lower = better)
function reqScore(sh, nurse) {
  const s = gStats(sh);
  const req = getReq(nurse);
  if (req.shifts === 0) return 0;
  let score = 0;
  score += Math.abs(s.total - req.shifts);
  score += Math.max(0, req.mon - s.mon) * 0.3;
  score += Math.max(0, req.fri - s.fri) * 0.3;
  score += Math.max(0, req.wknd - s.wknd) * 0.3;
  return score;
}

function balance(fS, fN, hd, wS, mc) {
  const b = fS.map(s => [...s]);
  const mv = [...mc];
  const log = [];

  for (let it = 0; it < 800; it++) {
    const da = Array.from({ length: TD }, (_, d) => allOn(b, wS, d));
    const dm = Array.from({ length: TD }, (_, d) => headOn(hd, d) ? MN : MN + 1);
    const dn = Array.from({ length: TD }, (_, d) => headOn(hd, d) ? TGT : TGT + 1);

    // Collect all understaffed days (below minimum) and overstaffed days (above target)
    const underDays = [];
    const overDays = [];
    for (let d = 0; d < TD; d++) {
      if (da[d] < dm[d]) underDays.push({ d, deficit: dm[d] - da[d] });
      if (da[d] > dn[d]) overDays.push({ d, surplus: da[d] - dn[d] });
    }

    // If nothing under minimum, try to smooth: find days above target and days below target
    if (underDays.length === 0) {
      for (let d = 0; d < TD; d++) {
        if (da[d] < dn[d]) underDays.push({ d, deficit: dn[d] - da[d] });
        if (da[d] > dn[d]) overDays.push({ d, surplus: da[d] - dn[d] });
      }
    }

    if (underDays.length === 0 || overDays.length === 0) break;

    // Sort: worst deficit first, worst surplus first
    underDays.sort((a, b) => b.deficit - a.deficit);
    overDays.sort((a, b) => b.surplus - a.surplus);

    // Try all combinations of over->under to find the best move
    let bestN = null, bestFrom = null, bestTo = null, bestScore = Infinity;

    for (const over of overDays) {
      for (const under of underDays) {
        if (over.d === under.d) continue;
        if (Math.floor(over.d / 7) !== Math.floor(under.d / 7)) continue;
        for (let n = 0; n < b.length; n++) {
          if (fN[n].cat === "leave") continue;
          if (b[n][over.d] !== ON || b[n][under.d] !== OFF) continue;
          // Don't move to unavailable days
          if (b[n][under.d] === UNA) continue;

          const after = [...b[n]];
          after[over.d] = OFF; after[under.d] = ON;

          const reqDmg = reqScore(after, fN[n]) - reqScore(b[n], fN[n]);
          // Score: prioritize fixing big imbalances, then req damage, then move fairness
          const imbalanceGain = over.surplus + under.deficit; // bigger = more impactful move
          const score = -imbalanceGain * 10 + reqDmg * 2 + mv[n] * 1;

          if (score < bestScore) {
            bestScore = score;
            bestN = n;
            bestFrom = over.d;
            bestTo = under.d;
          }
        }
      }
      if (bestN !== null) break; // found a move from the worst overstaffed day
    }

    if (bestN === null) break;
    b[bestN][bestFrom] = OFF; b[bestN][bestTo] = ON;
    mv[bestN]++;
    log.push({ nurse: bestN, from: bestFrom, to: bestTo });
  }
  return { balanced: b, log: log, mc: mv };
}

function asnCharge(fS, fN, hd, wS, wk) {
  const a = Array(TD).fill(null);
  const fc = fN.map(() => 0);
  const wc = wk.map(() => 0);

  // Build weekend pairs: Sat (w*7+6) pairs with Sun (w*7+7 i.e. next week's day 0)
  const wkndPairs = [];
  for (let w = 0; w < WEEKS; w++) {
    const satD = w * 7 + 6;
    const sunD = (w + 1) * 7; // Sunday of next week
    const pair = [satD];
    if (sunD < TD) pair.push(sunD);
    wkndPairs.push(pair);
  }
  // Also handle week 0's Sunday (day 0) if it's not paired with a prior Saturday
  // Day 0 is the very first Sunday — stands alone since there's no prior Saturday
  if (a[0] === null) {
    const hI = hd.findIndex(h => h.shifts[0]);
    if (hI !== -1) {
      a[0] = { tp: "head", ix: hI, nm: hd[hI].name };
    } else {
      // Will be picked up as a standalone weekend day below
    }
  }

  // First pass: assign weekend pairs
  for (const pair of wkndPairs) {
    // Check head nurse coverage
    pair.forEach(d => {
      const hI = hd.findIndex(h => h.shifts[d]);
      if (hI !== -1) a[d] = { tp: "head", ix: hI, nm: hd[hI].name };
    });

    const uncovered = pair.filter(d => a[d] === null);
    if (uncovered.length === 0) continue;

    // Gather candidates available on ALL uncovered days of this pair
    const cands = [];
    wk.forEach((wd, wi) => {
      if (!wd.ce) return;
      const availAll = uncovered.every(d => isActive(wS[wi] ? wS[wi][d] : 0));
      if (availAll) cands.push({ tp: "wknd", ix: wi, ct: wc[wi], nm: wd.name, prio: 0 });
    });
    fS.forEach((s, n) => {
      if (!fN[n].ce) return;
      const availAll = uncovered.every(d => isActive(s[d]));
      if (availAll) cands.push({ tp: "floor", ix: n, ct: fc[n], nm: fN[n].name, prio: 1 });
    });

    if (cands.length > 0) {
      cands.sort((x, y) => x.prio - y.prio || x.ct - y.ct);
      const pick = cands[0];
      uncovered.forEach(d => {
        a[d] = { tp: pick.tp, ix: pick.ix, nm: pick.nm };
      });
      if (pick.tp === "wknd") wc[pick.ix] += uncovered.length;
      else fc[pick.ix] += uncovered.length;
    } else {
      // Fallback: assign individually
      uncovered.forEach(d => {
        const dayCands = [];
        wk.forEach((wd, wi) => {
          if (wd.ce && isActive(wS[wi] ? wS[wi][d] : 0)) dayCands.push({ tp: "wknd", ix: wi, ct: wc[wi], nm: wd.name, prio: 0 });
        });
        fS.forEach((s, n) => {
          if (fN[n].ce && isActive(s[d])) dayCands.push({ tp: "floor", ix: n, ct: fc[n], nm: fN[n].name, prio: 1 });
        });
        if (dayCands.length > 0) {
          dayCands.sort((x, y) => x.prio - y.prio || x.ct - y.ct);
          const p = dayCands[0];
          a[d] = p;
          if (p.tp === "wknd") wc[p.ix]++; else fc[p.ix]++;
        }
      });
    }
  }

  // Handle standalone first Sunday (day 0) if still unassigned
  if (a[0] === null && isW(0)) {
    const cands = [];
    wk.forEach((wd, wi) => {
      if (wd.ce && isActive(wS[wi] ? wS[wi][0] : 0)) cands.push({ tp: "wknd", ix: wi, ct: wc[wi], nm: wd.name, prio: 0 });
    });
    fS.forEach((s, n) => {
      if (fN[n].ce && isActive(s[0])) cands.push({ tp: "floor", ix: n, ct: fc[n], nm: fN[n].name, prio: 1 });
    });
    if (cands.length > 0) {
      cands.sort((x, y) => x.prio - y.prio || x.ct - y.ct);
      const p = cands[0];
      a[0] = p;
      if (p.tp === "wknd") wc[p.ix]++; else fc[p.ix]++;
    }
  }

  // Second pass: assign weekdays
  for (let d = 0; d < TD; d++) {
    if (a[d] !== null) continue; // already assigned (weekend or head)
    if (isW(d)) continue; // weekend already handled above

    const hI = hd.findIndex(h => h.shifts[d]);
    if (hI !== -1) { a[d] = { tp: "head", ix: hI, nm: hd[hI].name }; continue; }

    const cands = [];
    fS.forEach((s, n) => {
      if (isActive(s[d]) && fN[n].ce) cands.push({ tp: "floor", ix: n, ct: fc[n], nm: fN[n].name });
    });
    wS.forEach((s, wi) => {
      if (isActive(s[d]) && wk[wi].ce) cands.push({ tp: "wknd", ix: wi, ct: wc[wi], nm: wk[wi].name });
    });
    if (cands.length > 0) {
      cands.sort((x, y) => x.ct - y.ct);
      const p = cands[0];
      a[d] = p;
      if (p.tp === "floor") fc[p.ix]++; else wc[p.ix]++;
    }
  }
  return { a: a, fc: fc, wc: wc };
}

function doExport(hd, fN, fS, wk, wS, cg, mc, sd) {
  const dh = Array.from({ length: TD }, (_, d) => DN[d % 7] + " " + ds(sd, d));
  let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
  h += '<head><meta charset="utf-8">';
  h += '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>';
  h += '<x:ExcelWorksheet><x:Name>Schedule</x:Name><x:WorksheetOptions><x:FitToPage/></x:WorksheetOptions></x:ExcelWorksheet>';
  h += '<x:ExcelWorksheet><x:Name>Requirements</x:Name><x:WorksheetOptions><x:FitToPage/></x:WorksheetOptions></x:ExcelWorksheet>';
  h += '<x:ExcelWorksheet><x:Name>Charge</x:Name><x:WorksheetOptions><x:FitToPage/></x:WorksheetOptions></x:ExcelWorksheet>';
  h += '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->';
  h += '<style>td,th{font-family:Arial;font-size:10pt;padding:4px 6px;border:1px solid #ccc}th{background:#2563eb;color:#fff;font-weight:bold}.on{background:#dbeafe;text-align:center;font-weight:bold}.lk{background:#bbf7d0;text-align:center;font-weight:bold}.ua{background:#fecaca;text-align:center}.ch{background:#fef08a;text-align:center;font-weight:bold}.hd{background:#c7d2fe;text-align:center;font-weight:bold}.ok{background:#bbf7d0}.wn{background:#fef08a}.bd{background:#fecaca}.sc{background:#1e293b;color:#fff;font-weight:bold}</style>';
  h += '</head><body>';

  // Schedule sheet
  h += '<table id="Schedule"><tr><th>Staff</th>';
  dh.forEach(x => { h += '<th>' + x + '</th>'; });
  h += '</tr>';
  h += '<tr><td class="sc" colspan="' + (TD + 1) + '">HEAD NURSES</td></tr>';
  hd.forEach(hn => {
    h += '<tr><td style="font-weight:bold;color:#2563eb">' + hn.name + '</td>';
    hn.shifts.forEach(v => { h += v ? '<td class="hd">C</td>' : '<td></td>'; });
    h += '</tr>';
  });
  h += '<tr><td class="sc" colspan="' + (TD + 1) + '">FLOOR NURSES</td></tr>';
  fS.forEach((sh, i) => {
    const n = fN[i];
    h += '<tr><td>' + (n.ce ? "* " : "") + n.name + '</td>';
    sh.forEach((st, d) => {
      const ic = cg.a[d] && cg.a[d].tp === "floor" && cg.a[d].ix === i;
      if (st === ON) h += ic ? '<td class="ch">C</td>' : '<td class="on">X</td>';
      else if (st === UNA) h += '<td class="ua">OFF</td>';
      else h += '<td></td>';
    });
    h += '</tr>';
  });
  h += '<tr><td class="sc" colspan="' + (TD + 1) + '">WEEKENDERS</td></tr>';
  wS.forEach((sh, i) => {
    const w = wk[i];
    h += '<tr><td style="color:#16a34a">' + (w.ce ? "* " : "") + w.name + '</td>';
    sh.forEach((st, d) => {
      const ic = cg.a[d] && cg.a[d].tp === "wknd" && cg.a[d].ix === i;
      const active = isActive(st);
      if (active) h += ic ? '<td class="ch">C</td>' : (st === LCK ? '<td class="lk">LK</td>' : '<td class="on">X</td>');
      else if (st === UNA) h += '<td class="ua">OFF</td>';
      else h += '<td></td>';
    });
    h += '</tr>';
  });
  h += '<tr><td style="font-weight:bold">TOTAL</td>';
  for (let d = 0; d < TD; d++) {
    const t = allOn(fS, wS, d);
    const hh = headOn(hd, d);
    const tgt = hh ? TGT : TGT + 1;
    const mn = hh ? MN : MN + 1;
    const cls = t < mn ? "bd" : t >= tgt ? "ok" : "wn";
    h += '<td class="' + cls + '" style="text-align:center;font-weight:bold">' + t + '</td>';
  }
  h += '</tr></table>';

  // Requirements sheet
  h += '<table id="Requirements"><tr><th>Nurse</th><th>Total</th><th>Mon</th><th>Fri</th><th>Wknd</th><th>Moves</th><th>Charge</th><th>Status</th></tr>';
  fS.forEach((sh, i) => {
    const s = gStats(sh);
    const n = fN[i];
    const req = getReq(n);
    const iss = chkReq(s, n);
    h += '<tr><td>' + (n.cat !== "full" ? "[" + CATS[n.cat||"full"].label + "] " : "") + n.name + '</td>';
    h += '<td style="text-align:center">' + s.total + '/' + req.shifts + '</td>';
    h += '<td style="text-align:center">' + s.mon + '/' + req.mon + '</td>';
    h += '<td style="text-align:center">' + s.fri + '/' + req.fri + '</td>';
    h += '<td style="text-align:center">' + s.wknd + '/' + req.wknd + '</td>';
    h += '<td style="text-align:center">' + mc[i] + '</td>';
    h += '<td style="text-align:center">' + (n.ce ? cg.fc[i] : "-") + '</td>';
    h += '<td class="' + (iss.length === 0 && s.total > 0 ? "ok" : "bd") + '">' + (iss.length === 0 && s.total > 0 ? "Met" : iss.join(", ")) + '</td></tr>';
  });
  h += '</table>';

  // Charge sheet
  h += '<table id="Charge"><tr><th>Day</th><th>Date</th><th>Charge</th></tr>';
  for (let d = 0; d < TD; d++) {
    const ca = cg.a[d];
    h += '<tr><td>' + DNF[d % 7] + ' W' + (Math.floor(d / 7) + 1) + '</td>';
    h += '<td>' + ds(sd, d) + '</td>';
    h += '<td>' + (ca ? ca.nm : "NONE") + '</td></tr>';
  }
  h += '</table></body></html>';

  const blob = new Blob([h], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "schedule_" + sd + ".xls";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const Badge = ({ children, color }) => {
  const cs = {
    red: { b: "#fecaca", f: "#991b1b", d: "#f87171" },
    green: { b: "#bbf7d0", f: "#166534", d: "#4ade80" },
    yellow: { b: "#fef08a", f: "#854d0e", d: "#facc15" },
    blue: { b: "#bfdbfe", f: "#1e40af", d: "#60a5fa" },
    gray: { b: "#e5e7eb", f: "#374151", d: "#9ca3af" },
    orange: { b: "#fed7aa", f: "#9a3412", d: "#fb923c" }
  };
  const c = cs[color] || cs.gray;
  return (
    <span style={{
      background: c.b, color: c.f, border: "1px solid " + c.d,
      padding: "2px 8px", borderRadius: "9999px", fontSize: "11px",
      fontWeight: 600, whiteSpace: "nowrap"
    }}>{children}</span>
  );
};

const SK = "peds-onc-offline-v2";

function App() {
  const [loaded, setLoaded] = useState(false);
  const [heads, setHeads] = useState(() => [
    { name: "Head Nurse 1 (You)", shifts: Array(TD).fill(false) },
    { name: "Head Nurse 2 (Partner)", shifts: Array(TD).fill(false) }
  ]);
  const [wkrs, setWkrs] = useState(() => Array.from({ length: 7 }, (_, i) => ({ name: "Weekender " + (i + 1), ce: false })));
  const [wS, setWS] = useState(() => mkWS(7));
  const [fN, setFN] = useState(() => Array.from({ length: 21 }, (_, i) => ({ name: "Nurse " + (i + 1), ce: false, cat: "full", prnTarget: 0 })));
  const [fS, setFS] = useState(() => Array.from({ length: 21 }, () => Array(TD).fill(OFF)));
  const [sd, setSD] = useState("2026-03-01");
  const [view, setView] = useState("schedule");
  const [changes, setChanges] = useState([]);
  const [mc, setMC] = useState(() => Array.from({ length: 21 }, () => 0));
  const [manage, setManage] = useState(false);
  const [confirm, setConfirm] = useState(null);
  const [saveMsg, setSaveMsg] = useState("");
  const tmr = useRef(null);

  // Load
  useEffect(() => {
    try {
      const raw = localStorage.getItem(SK);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.heads) setHeads(d.heads);
        if (d.wkrs) setWkrs(d.wkrs);
        if (d.wS) setWS(d.wS);
        if (d.fN) setFN(d.fN);
        if (d.fS) setFS(d.fS);
        if (d.sd) setSD(d.sd);
        if (d.mc) setMC(d.mc);
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  // Save
  const save = useCallback((data) => {
    try {
      localStorage.setItem(SK, JSON.stringify(data));
      setSaveMsg("Saved");
      if (tmr.current) clearTimeout(tmr.current);
      tmr.current = setTimeout(() => setSaveMsg(""), 2000);
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      save({ heads, wkrs, wS, fN, fS, sd, mc });
    }, 1500);
    return () => clearTimeout(t);
  }, [heads, wkrs, wS, fN, fS, sd, mc, loaded, save]);

  // Derived
  const daily = useMemo(() => Array.from({ length: TD }, (_, d) => {
    const t = allOn(fS, wS, d);
    const hh = headOn(heads, d);
    return { t, hh, tgt: hh ? TGT : TGT + 1, mn: hh ? MN : MN + 1 };
  }), [fS, wS, heads]);

  const fStats = useMemo(() => fS.map(gStats), [fS]);
  const cg = useMemo(() => asnCharge(fS, fN, heads, wS, wkrs), [fS, fN, heads, wS, wkrs]);

  // Actions
  const cycleF = useCallback((n, d) => {
    setFS(p => { const nx = p.map(s => [...s]); nx[n][d] = (nx[n][d] + 1) % 3; return nx; });
  }, []);

  const cycleW = useCallback((w, d) => {
    setWS(p => {
      const nx = p.map(s => [...s]);
      const c = nx[w][d];
      if (c === LCK) nx[w][d] = UNA;
      else if (c === UNA && isW(d)) nx[w][d] = LCK;
      else if (c === UNA) nx[w][d] = OFF;
      else nx[w][d] = (c + 1) % 3;
      return nx;
    });
  }, []);

  const lockW = useCallback((w, d) => {
    setWS(p => {
      const nx = p.map(s => [...s]);
      if (nx[w][d] === ON) nx[w][d] = LCK;
      else if (nx[w][d] === LCK) nx[w][d] = ON;
      return nx;
    });
  }, []);

  const toggleH = useCallback((h, d) => {
    setHeads(p => p.map((hn, i) => i === h ? { ...hn, shifts: hn.shifts.map((v, j) => j === d ? !v : v) } : hn));
  }, []);

  const runBalance = useCallback(() => {
    const r = balance(fS, fN, heads, wS, mc);
    setFS(r.balanced);
    setMC(r.mc);
    setChanges(r.log);
  }, [fS, fN, heads, wS, mc]);

  const newCycle = useCallback(() => {
    setFS(fN.map(() => Array(TD).fill(OFF)));
    setWS(mkWS(wkrs.length));
    setChanges([]);
    setMC(fN.map(() => 0));
    setHeads(p => p.map(h => ({ ...h, shifts: Array(TD).fill(false) })));
    setConfirm(null);
  }, [fN, wkrs.length]);

  const runExport = useCallback(() => {
    doExport(heads, fN, fS, wkrs, wS, cg, mc, sd);
  }, [heads, fN, fS, wkrs, wS, cg, mc, sd]);

  const loadDemo = useCallback(() => {
    // Real nurse names, categories, charge eligibility
    const demoFN = [
      { name: "Adams, Claire", ce: true, cat: "full", prnTarget: 0 },
      { name: "Baker, Dana", ce: true, cat: "part", prnTarget: 0 },
      { name: "Chen, Priya", ce: false, cat: "prn", prnTarget: 2 },
      { name: "Diaz, Maria", ce: false, cat: "full", prnTarget: 0 },
      { name: "Evans, Sophie", ce: false, cat: "full", prnTarget: 0 },
      { name: "Foster, Jamie", ce: true, cat: "leave", prnTarget: 0 },
      { name: "Garcia, Rosa", ce: false, cat: "prn", prnTarget: 7 },
      { name: "Hill, Natalie", ce: false, cat: "full", prnTarget: 0 },
      { name: "Ingram, Tess", ce: true, cat: "part", prnTarget: 0 },
      { name: "Jones, Megan", ce: false, cat: "full", prnTarget: 0 },
      { name: "Kim, Laura", ce: false, cat: "part", prnTarget: 0 },
      { name: "Lee, Brooke", ce: false, cat: "full", prnTarget: 0 },
      { name: "Moore, Jenna", ce: false, cat: "prn", prnTarget: 10 },
      { name: "Nash, Kelly", ce: false, cat: "full", prnTarget: 0 },
      { name: "Ortiz, Carmen", ce: false, cat: "full", prnTarget: 0 },
      { name: "Park, Yuna", ce: true, cat: "leave", prnTarget: 0 },
      { name: "Reed, Hailey", ce: false, cat: "full", prnTarget: 0 },
      { name: "Scott, Amber", ce: true, cat: "full", prnTarget: 0 },
      { name: "Torres, Val", ce: true, cat: "full", prnTarget: 0 },
      { name: "Vance, Ellie", ce: false, cat: "full", prnTarget: 0 },
      { name: "Ward, Paige", ce: true, cat: "full", prnTarget: 0 }
    ];
    // Intentionally unbalanced: heavy Mon-Wed, light Thu-Sat
    // Each row is 42 days. Full-time=18 shifts, Part-time=12, PRN=custom, Leave=0
    const seed = (shifts, unavail) => {
      const row = Array(TD).fill(OFF);
      for (const d of shifts) if (d < TD) row[d] = ON;
      for (const d of (unavail || [])) if (d < TD) row[d] = UNA;
      return row;
    };
    // Cluster most shifts on Mon(1,8,15,22,29,36) Tue(2,9,16,23,30,37) Wed(3,10,17,24,31,38)
    // Leave Thu/Fri/weekends sparse to create obvious imbalance
    const demoFS = [
      // Burns (FT 18): heavy early week
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Davis (PT 12): Mon-Tue heavy
      seed([1,2,8,9,15,16,22,23,29,30,36,37]),
      // Desai (PRN 2): just 2 Mon shifts
      seed([1,8]),
      // Green (FT 18): Mon-Wed stacked, one unavail
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38], [4,11]),
      // Hagen (FT 18): similar cluster, some Thu
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,37,38,4,11]),
      // Harle (Leave): empty
      seed([]),
      // Hooper (PRN 7): Mon-Tue only
      seed([1,2,8,9,15,16,22]),
      // Jeitz (FT 18): Mon-Wed heavy, one Fri
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,5]),
      // Linville (PT 12): Mon-Tue
      seed([1,2,8,9,15,16,22,23,29,30,36,37]),
      // Madden (FT 18): Mon-Wed cluster
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Maksin (PT 14): heavy Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30]),
      // McMillian (FT 18): Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Mitchell (PRN 10): Mon-Tue heavy
      seed([1,2,8,9,15,16,22,23,29,30]),
      // Nelson (FT 18): Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Patillo (FT 18): Mon-Wed mostly
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Quinn (Leave): empty
      seed([]),
      // Reardon (FT 17): Mon-Wed, one Thu, unavail Fri
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37], [5,12,19,26,33,40]),
      // Rushing (FT 18): Mon-Wed cluster
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Stroud (FT 17): mostly Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37]),
      // Wilkinson (FT 18): all Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38]),
      // Wolf (FT 18): all Mon-Wed
      seed([1,2,3,8,9,10,15,16,17,22,23,24,29,30,31,36,37,38])
    ];
    const demoWkrs = [
      { name: "Blake, Taylor", ce: false },
      { name: "Cruz, Mia", ce: false },
      { name: "Dean, Riley", ce: true },
      { name: "Flynn, Casey", ce: false },
      { name: "Hayes, Morgan", ce: true },
      { name: "Klein, Robin", ce: false },
      { name: "Patel, Sasha", ce: false }
    ];
    // Weekender schedules: weekends locked, Byard+Parrish also work Wed(3,10,17,24,31,38)
    const demoWS = demoWkrs.map((w, i) => {
      const row = Array.from({ length: TD }, (_, d) => isW(d) ? LCK : OFF);
      if (i === 0 || i === 6) { // Byard, Parrish: also work Wednesdays
        for (let wk = 0; wk < WEEKS; wk++) row[wk * 7 + 3] = LCK;
      }
      return row;
    });
    const demoHeads = [
      { name: "Head Nurse A", shifts: Array.from({ length: TD }, (_, d) => d % 7 === 1 || d % 7 === 4) }, // Mon+Thu
      { name: "Head Nurse B", shifts: Array.from({ length: TD }, (_, d) => d % 7 === 2 || d % 7 === 5) } // Tue+Fri
    ];
    setFN(demoFN);
    setFS(demoFS);
    setWkrs(demoWkrs);
    setWS(demoWS);
    setHeads(demoHeads);
    setMC(demoFN.map(() => 0));
    setChanges([]);
    setSD("2026-04-26");
  }, []);

  const addF = useCallback(() => {
    setFN(p => [...p, { name: "Nurse " + (p.length + 1), ce: false, cat: "full", prnTarget: 0 }]);
    setFS(p => [...p, Array(TD).fill(OFF)]);
    setMC(p => [...p, 0]);
  }, []);

  const rmF = useCallback((i) => {
    setFN(p => p.filter((_, j) => j !== i));
    setFS(p => p.filter((_, j) => j !== i));
    setMC(p => p.filter((_, j) => j !== i));
    setConfirm(null);
  }, []);

  const addW = useCallback(() => {
    setWkrs(p => [...p, { name: "Weekender " + (p.length + 1), ce: false }]);
    setWS(p => [...p, Array.from({ length: TD }, (_, d) => isW(d) ? LCK : OFF)]);
  }, []);

  const rmW = useCallback((i) => {
    setWkrs(p => p.filter((_, j) => j !== i));
    setWS(p => p.filter((_, j) => j !== i));
    setConfirm(null);
  }, []);

  const cols = Array.from({ length: TD }, (_, d) => ({
    dow: d % 7, wk: isW(d), wn: Math.floor(d / 7) + 1, sw: d % 7 === 0, ds: ds(sd, d)
  }));

  const tabs = [
    ["schedule", "Schedule Grid"],
    ["requirements", "Requirements"],
    ["charge", "Charge Roster"],
    ["daily", "Daily Summary"],
    ["changes", "Changes (" + changes.length + ")"]
  ];

  if (!loaded) {
    return (
      <div style={{ background: "#0c1117", color: "#8b949e", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "sans-serif" }}>
        Loading...
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", background: "#0c1117", color: "#d1d5db", minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{height:6px;width:6px}
        ::-webkit-scrollbar-track{background:#161b22}
        ::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
        .cb{width:34px;height:26px;border:1px solid #21262d;background:#161b22;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .1s;color:#484f58;font-family:'JetBrains Mono',monospace;border-radius:3px}
        .cb:hover{border-color:#58a6ff;background:#1a2332}
        .cb.on{background:#1f6feb;border-color:#388bfd;color:#fff}
        .cb.on.wk{background:#9e6a03;border-color:#d29922}
        .cb.ua{background:#3d1f20;border-color:#f85149;color:#f85149}
        .cb.wk{background:#1a1610;border-color:#30302a}
        .cb.ho{background:#1158c7;border-color:#58a6ff;color:#fff}
        .cb.wo{background:#2d5a1e;border-color:#3fb950;color:#fff}
        .cb.wo.wk{background:#6e5c09;border-color:#d29922;color:#fff}
        .cb.lk{background:#1a4d1a;border-color:#238636;color:#3fb950}
        .cb.lk.wk{background:#5c4304;border-color:#9e6a03;color:#d29922}
        .tb{padding:8px 16px;border:none;background:transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;font-family:inherit}
        .tb:hover{color:#d1d5db}
        .tb.active{color:#58a6ff;border-bottom-color:#58a6ff}
        .ab{padding:8px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;font-family:inherit}
        .ni{background:transparent;border:none;color:#c9d1d9;font-size:12px;font-family:inherit;width:130px;padding:3px 6px;border-radius:4px}
        .ni:hover{background:#161b22}
        .ni:focus{background:#161b22;outline:1px solid #388bfd;color:#fff}
        .st{cursor:pointer;font-size:14px;user-select:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px}
        .st:hover{transform:scale(1.2);background:#21262d}
        .sl{position:sticky;left:0;z-index:6;padding:3px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
      `}</style>

      {/* HEADER */}
      <div style={{ borderBottom: "1px solid #21262d", padding: "16px 22px", background: "#0d1117" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
          <div style={{ width: 36, height: 36, borderRadius: 8, background: "linear-gradient(135deg,#1f6feb,#388bfd)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17 }}>🏥</div>
          <div style={{ flex: 1 }}>
            <h1 style={{ fontSize: 17, fontWeight: 700, color: "#f0f6fc" }}>Peds Onc Schedule Balancer</h1>
            <p style={{ fontSize: 11, color: "#484f58", marginTop: 1 }}>{fN.length} Floor · {wkrs.length} Weekenders · 2 Head · Target {TGT}+1/day · Offline</p>
          </div>
          {saveMsg && <span style={{ fontSize: 10, color: "#3fb950", fontFamily: "monospace" }}>{saveMsg} ✓</span>}
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <label style={{ fontSize: 11, color: "#8b949e", display: "flex", alignItems: "center", gap: 6 }}>
            Start:
            <input type="date" value={sd} onChange={e => setSD(e.target.value)} style={{ background: "#0d1117", border: "1px solid #21262d", color: "#c9d1d9", padding: "4px 8px", borderRadius: 6, fontSize: 11, fontFamily: "inherit" }} />
          </label>
          <button className="ab" onClick={runBalance} style={{ background: "#238636", color: "#fff" }}>⚡ Balance</button>
          <button className="ab" onClick={runExport} style={{ background: "#1f6feb", color: "#fff" }}>📥 Excel</button>
          <button className="ab" onClick={() => setConfirm({ tp: "cycle" })} style={{ background: "#9e6a03", color: "#fff" }}>🔄 New Cycle</button>
          <button className="ab" onClick={() => setManage(!manage)} style={{ background: "#21262d", color: "#8b949e", border: "1px solid #30363d" }}>{manage ? "✕ Close" : "⚙ Staff"}</button>
          <button className="ab" onClick={loadDemo} style={{ background: "#6e40c9", color: "#fff", border: "1px solid #8b5cf6" }}>🧪 Load Demo</button>
        </div>
      </div>

      {/* STAFF PANEL */}
      {manage && (
        <div style={{ padding: "14px 22px", background: "#161b22", borderBottom: "1px solid #21262d" }}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <div>
              <h3 style={{ fontSize: 11, fontWeight: 700, color: "#8b949e", marginBottom: 8, textTransform: "uppercase" }}>Floor ({fN.length})</h3>
              <div style={{ maxHeight: 200, overflowY: "auto", marginBottom: 8 }}>
                {fN.map((n, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, marginBottom: 3 }}>
                    <span className="st" onClick={() => setFN(p => p.map((x, j) => j === i ? { ...x, ce: !x.ce } : x))} style={{ color: n.ce ? "#d29922" : "#21262d", fontSize: 12 }}>★</span>
                    <input className="ni" value={n.name} onChange={e => setFN(p => p.map((x, j) => j === i ? { ...x, name: e.target.value } : x))} style={{ width: 120 }} />
                    <select value={n.cat || "full"} onChange={e => setFN(p => p.map((x, j) => j === i ? { ...x, cat: e.target.value } : x))}
                      style={{ background: "#0d1117", border: "1px solid #21262d", color: n.cat === "leave" ? "#f85149" : n.cat === "prn" ? "#d29922" : n.cat === "part" ? "#58a6ff" : "#8b949e", borderRadius: 4, fontSize: 10, padding: "2px 4px", fontFamily: "inherit" }}>
                      <option value="full">Full-time</option>
                      <option value="part">Part-time</option>
                      <option value="prn">PRN</option>
                      <option value="leave">Leave</option>
                    </select>
                    {n.cat === "prn" && (
                      <input type="number" min="0" max="18" value={n.prnTarget || 0}
                        onChange={e => setFN(p => p.map((x, j) => j === i ? { ...x, prnTarget: parseInt(e.target.value) || 0 } : x))}
                        style={{ background: "#0d1117", border: "1px solid #21262d", color: "#d29922", borderRadius: 4, fontSize: 10, padding: "2px 4px", width: 36, textAlign: "center", fontFamily: "monospace" }}
                        title="PRN shift target" />
                    )}
                    <button onClick={() => setConfirm({ tp: "rf", ix: i, nm: n.name })} style={{ fontSize: 10, color: "#f85149", cursor: "pointer", background: "none", border: "1px solid #3d1f20", borderRadius: 4, padding: "1px 6px" }}>✕</button>
                  </div>
                ))}
              </div>
              <button className="ab" onClick={addF} style={{ background: "#238636", color: "#fff", fontSize: 11, padding: "5px 12px" }}>+ Add</button>
            </div>
            <div>
              <h3 style={{ fontSize: 11, fontWeight: 700, color: "#3fb950", marginBottom: 8, textTransform: "uppercase" }}>Weekenders ({wkrs.length})</h3>
              <div style={{ maxHeight: 200, overflowY: "auto", marginBottom: 8 }}>
                {wkrs.map((w, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, marginBottom: 3 }}>
                    <span className="st" onClick={() => setWkrs(p => p.map((x, j) => j === i ? { ...x, ce: !x.ce } : x))} style={{ color: w.ce ? "#d29922" : "#21262d", fontSize: 12 }}>★</span>
                    <input className="ni" value={w.name} onChange={e => setWkrs(p => p.map((x, j) => j === i ? { ...x, name: e.target.value } : x))} style={{ width: 140, color: "#7ee787" }} />
                    <button onClick={() => setConfirm({ tp: "rw", ix: i, nm: w.name })} style={{ fontSize: 10, color: "#f85149", cursor: "pointer", background: "none", border: "1px solid #3d1f20", borderRadius: 4, padding: "1px 6px" }}>✕</button>
                  </div>
                ))}
              </div>
              <button className="ab" onClick={addW} style={{ background: "#238636", color: "#fff", fontSize: 11, padding: "5px 12px" }}>+ Add</button>
            </div>
            <div>
              <h3 style={{ fontSize: 11, fontWeight: 700, color: "#58a6ff", marginBottom: 8, textTransform: "uppercase" }}>Head Nurses</h3>
              {heads.map((h, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, marginBottom: 3 }}>
                  <span>👑</span>
                  <input className="ni" value={h.name} onChange={e => setHeads(p => p.map((x, j) => j === i ? { ...x, name: e.target.value } : x))} style={{ width: 180, color: "#79c0ff" }} />
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* TABS */}
      <div style={{ display: "flex", borderBottom: "1px solid #21262d", padding: "0 22px", background: "#0d1117", overflowX: "auto" }}>
        {tabs.map(([k, l]) => (
          <button key={k} className={"tb" + (view === k ? " active" : "")} onClick={() => setView(k)}>{l}</button>
        ))}
      </div>

      <div style={{ padding: "16px 22px" }}>

        {/* SCHEDULE */}
        {view === "schedule" && (
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", fontSize: 11 }}>
              <thead><tr>
                <th style={{ width: 175, position: "sticky", left: 0, background: "#0c1117", zIndex: 10, textAlign: "left", padding: "4px 6px", color: "#484f58", fontWeight: 500, fontSize: 10 }}>Staff</th>
                {cols.map((c, d) => (
                  <th key={d} style={{ textAlign: "center", padding: "2px 1px", minWidth: 36 }}>
                    {c.sw && <div style={{ fontSize: 8, color: "#388bfd", fontWeight: 700 }}>W{c.wn}</div>}
                    <div style={{ fontSize: 8, color: c.wk ? "#d29922" : "#484f58", fontWeight: c.wk ? 700 : 400 }}>{DN[c.dow]}</div>
                    <div style={{ fontSize: 9, color: c.wk ? "#e3b341" : "#8b949e" }}>{c.ds}</div>
                  </th>

              <tbody>
                {/* HEAD */}
                <tr><td className="sl" style={{ background: "#0e1a2b", color: "#58a6ff" }} colSpan={TD + 1}>👑 Head Nurses</td></tr>
                {heads.map((hn, hI) => (
                  <tr key={"h" + hI} style={{ background: "#0e1a2b" }}>
                    <td style={{ position: "sticky", left: 0, background: "#0e1a2b", zIndex: 5, padding: "1px 6px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <span style={{ fontSize: 11 }}>👑</span>
                        <input className="ni" value={hn.name} style={{ color: "#79c0ff" }} onChange={e => setHeads(p => p.map((h, i) => i === hI ? { ...h, name: e.target.value } : h))} />
                        <span style={{ fontSize: 9, color: "#484f58", fontFamily: "monospace", marginLeft: "auto" }}>{hn.shifts.filter(Boolean).length}d</span>
                      </div>
                    </td>
                    {hn.shifts.map((v, dI) => (
                      <td key={dI} style={{ padding: "1px" }}>
                        <button className={"cb" + (v ? " ho" : "") + (isW(dI) ? " wk" : "")} onClick={() => toggleH(hI, dI)}>{v ? "C" : ""}</button>
                      </td>
                    ))}
                  </tr>
                ))}
                <tr><td colSpan={TD + 1} style={{ height: 3, background: "#21262d" }} /></tr>

                {/* FLOOR */}
                <tr><td className="sl" style={{ background: "#0c1117", color: "#8b949e" }} colSpan={TD + 1}>Floor Nurses · ★ charge · click: off → on → unavail</td></tr>
                {fS.map((sh, nI) => (
                  <tr key={"f" + nI}>
                    <td style={{ position: "sticky", left: 0, background: "#0c1117", zIndex: 5, padding: "1px 2px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 1 }}>
                        <span className="st" onClick={() => setFN(p => p.map((n, i) => i === nI ? { ...n, ce: !n.ce } : n))} style={{ color: fN[nI] && fN[nI].ce ? "#d29922" : "#21262d" }}>★</span>
                        <input className="ni" value={fN[nI] ? fN[nI].name : ""} onChange={e => setFN(p => p.map((n, i) => i === nI ? { ...n, name: e.target.value } : n))} />
                        {mc[nI] > 0 && <span style={{ fontSize: 9, color: "#6e7681", fontFamily: "monospace" }}>↕{mc[nI]}</span>}
                      </div>
                    </td>
                    {sh.map((st, dI) => {
                      const w = isW(dI);
                      const ic = cg.a[dI] && cg.a[dI].tp === "floor" && cg.a[dI].ix === nI;
                      const cls = st === ON ? "on" : st === UNA ? "ua" : "";
                      return (
                        <td key={dI} style={{ padding: "1px" }}>
                          <button className={"cb " + cls + (w ? " wk" : "")} onClick={() => cycleF(nI, dI)} style={ic ? { boxShadow: "inset 0 0 0 2px #d29922" } : {}}>
                            {st === ON ? (ic ? "C" : "X") : st === UNA ? "—" : ""}
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}
                <tr><td colSpan={TD + 1} style={{ height: 3, background: "#21262d" }} /></tr>

                {/* WEEKENDERS */}
                <tr><td className="sl" style={{ background: "#111a0e", color: "#3fb950" }} colSpan={TD + 1}>🔶 Weekenders · 🔒 locked · right-click lock/unlock</td></tr>
                {wS.map((sh, wI) => (
                  <tr key={"w" + wI} style={{ background: "#111a0e" }}>
                    <td style={{ position: "sticky", left: 0, background: "#111a0e", zIndex: 5, padding: "1px 2px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 1 }}>
                        <span className="st" onClick={() => setWkrs(p => p.map((w, i) => i === wI ? { ...w, ce: !w.ce } : w))} style={{ color: wkrs[wI] && wkrs[wI].ce ? "#d29922" : "#21262d" }}>★</span>
                        <input className="ni" value={wkrs[wI] ? wkrs[wI].name : ""} style={{ color: "#7ee787" }} onChange={e => setWkrs(p => p.map((w, i) => i === wI ? { ...w, name: e.target.value } : w))} />
                      </div>
                    </td>
                    {sh.map((st, dI) => {
                      const w = isW(dI);
                      const ic = cg.a[dI] && cg.a[dI].tp === "wknd" && cg.a[dI].ix === wI;
                      const lk = st === LCK;
                      const onS = st === ON;
                      const cls = lk ? "lk" : onS ? "wo" : st === UNA ? "ua" : "";
                      return (
                        <td key={dI} style={{ padding: "1px" }}>
                          <button
                            className={"cb " + cls + (w ? " wk" : "")}
                            onClick={() => cycleW(wI, dI)}
                            onContextMenu={e => { e.preventDefault(); if (onS || lk) lockW(wI, dI); }}
                            style={ic ? { boxShadow: "inset 0 0 0 2px #d29922" } : {}}
                            title={lk ? "Locked — right-click to unlock" : onS ? "Right-click to lock" : ""}
                          >
                            {lk ? (ic ? "C" : "🔒") : onS ? (ic ? "C" : "X") : st === UNA ? "—" : ""}
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}

                {/* TOTALS */}
                <tr>
                  <td style={{ position: "sticky", left: 0, background: "#0c1117", zIndex: 5, padding: "6px 6px", fontWeight: 700, fontSize: 10, color: "#8b949e", borderTop: "2px solid #21262d" }}>TOTAL</td>
                  {daily.map((dd, d) => {
                    const bl = dd.t < dd.mn;
                    const at = dd.t >= dd.tgt;
                    const bg = dd.t === 0 ? "transparent" : bl ? "#3d1f20" : at ? "#122117" : "#2a1f0b";
                    const c = dd.t === 0 ? "#30363d" : bl ? "#f85149" : at ? "#3fb950" : "#d29922";
                    return <td key={d} style={{ textAlign: "center", fontWeight: 700, fontSize: 12, padding: "6px 2px", background: bg, color: c, borderTop: "2px solid #21262d", fontFamily: "monospace" }}>{dd.t}</td>;
                  })}
                </tr>
                <tr>
                  <td style={{ position: "sticky", left: 0, background: "#0c1117", zIndex: 5, padding: "3px 6px", fontWeight: 600, fontSize: 9, color: "#6e7681" }}>CHARGE</td>
                  {cg.a.map((ca, d) => (
                    <td key={d} style={{ textAlign: "center", fontSize: 11, padding: "3px 2px", color: ca ? (ca.tp === "head" ? "#58a6ff" : "#d29922") : "#f85149" }} title={ca ? ca.nm : "None"}>
                      {ca ? (ca.tp === "head" ? "👑" : "★") : "⚠"}
                    </td>
                  ))}
                </tr>
              </tbody>
            </table>
          </div>
        )}

        {/* REQUIREMENTS */}
        {view === "requirements" && (
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", maxWidth: 950 }}>
              <thead><tr>
                {["", "Nurse", "Total", "Mon", "Fri", "Wknd", "Moves", "Charge", "Status"].map(h => (
                  <th key={h} style={{ padding: "8px 10px", textAlign: "left", borderBottom: "2px solid #21262d", color: "#8b949e", fontSize: 10, fontWeight: 600, textTransform: "uppercase" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {fStats.map((s, i) => {
                  const n = fN[i];
                  const req = n ? getReq(n) : { shifts: 18, mon: 3, fri: 3, wknd: 1 };
                  const iss = chkReq(s, n);
                  const met = iss.length === 0 && s.total > 0;
                  const empty = s.total === 0;
                  const isLeave = n && n.cat === "leave";
                  const catLabel = n && n.cat && n.cat !== "full" ? CATS[n.cat].label : "";
                  return (
                    <tr key={i} style={{ borderBottom: "1px solid #161b22", opacity: isLeave ? 0.4 : 1 }}>
                      <td style={{ padding: "5px 10px" }}><span style={{ color: fN[i] && fN[i].ce ? "#d29922" : "#21262d", fontSize: 13 }}>★</span></td>
                      <td style={{ padding: "5px 10px", fontSize: 12, fontWeight: 500 }}>
                        {fN[i] ? fN[i].name : ""}
                        {catLabel && <span style={{ fontSize: 9, color: "#6e7681", marginLeft: 6 }}>[{catLabel}]</span>}
                      </td>
                      <td style={{ padding: "5px 10px", textAlign: "center" }}><Badge color={empty ? "gray" : s.total === req.shifts ? "green" : "yellow"}>{s.total}/{req.shifts}</Badge></td>
                      <td style={{ padding: "5px 10px", textAlign: "center" }}><Badge color={empty ? "gray" : s.mon >= req.mon ? "green" : "red"}>{s.mon}/{req.mon}</Badge></td>
                      <td style={{ padding: "5px 10px", textAlign: "center" }}><Badge color={empty ? "gray" : s.fri >= req.fri ? "green" : "red"}>{s.fri}/{req.fri}</Badge></td>
                      <td style={{ padding: "5px 10px", textAlign: "center" }}><Badge color={empty ? "gray" : s.wknd >= req.wknd ? "green" : "red"}>{s.wknd}/{req.wknd}</Badge></td>
                      <td style={{ padding: "5px 10px", textAlign: "center", fontFamily: "monospace", fontSize: 12, color: "#8b949e" }}>{mc[i]}</td>
                      <td style={{ padding: "5px 10px", textAlign: "center" }}>{fN[i] && fN[i].ce ? <Badge color="orange">{cg.fc[i]}</Badge> : <Badge color="gray">—</Badge>}</td>
                      <td style={{ padding: "5px 10px" }}>{isLeave ? <Badge color="gray">Leave</Badge> : empty ? <Badge color="gray">—</Badge> : met ? <Badge color="green">✓ Met</Badge> : <Badge color="red">✗ {iss.join(", ")}</Badge>}</td>
                    </tr>
                  );
                })}
                <tr><td colSpan={9} style={{ padding: "8px 10px", fontSize: 10, fontWeight: 700, color: "#3fb950", borderTop: "2px solid #21262d", textTransform: "uppercase" }}>🔶 Weekenders</td></tr>
                {wkrs.map((w, wi) => (
                  <tr key={"wr" + wi} style={{ borderBottom: "1px solid #161b22" }}>
                    <td style={{ padding: "5px 10px" }}><span style={{ color: w.ce ? "#d29922" : "#21262d", fontSize: 13 }}>★</span></td>
                    <td style={{ padding: "5px 10px", fontSize: 12, fontWeight: 500, color: "#7ee787" }}>{w.name}</td>
                    <td style={{ padding: "5px 10px", textAlign: "center" }}><Badge color="green">{wS[wi].filter(isActive).length}</Badge></td>
                    <td colSpan={3} style={{ padding: "5px 10px", textAlign: "center", fontSize: 10, color: "#484f58" }}>N/A</td>
                    <td style={{ padding: "5px 10px", textAlign: "center", color: "#484f58" }}>—</td>
                    <td style={{ padding: "5px 10px", textAlign: "center" }}>{w.ce ? <Badge color="orange">{cg.wc[wi]}</Badge> : <Badge color="gray">—</Badge>}</td>
                    <td style={{ padding: "5px 10px" }}><Badge color="blue">Weekender</Badge></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* CHARGE */}
        {view === "charge" && (
          <div>
            <p style={{ fontSize: 12, color: "#8b949e", marginBottom: 14 }}>👑 Head · ★ Staff · ⚠ Unassigned</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 10 }}>
              {Array.from({ length: WEEKS }, (_, w) => (
                <div key={w} style={{ background: "#161b22", borderRadius: 8, padding: 12, border: "1px solid #21262d" }}>
                  <h3 style={{ fontSize: 11, fontWeight: 700, color: "#388bfd", marginBottom: 8 }}>Week {w + 1}</h3>
                  {Array.from({ length: 7 }, (_, dow) => {
                    const d = w * 7 + dow;
                    const ca = cg.a[d];
                    const wkd = dow === 0 || dow === 6;
                    return (
                      <div key={dow} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3, padding: "3px 5px", borderRadius: 4, background: !ca ? "#3d1f2033" : "transparent" }}>
                        <span style={{ width: 26, fontSize: 9, fontWeight: wkd ? 700 : 400, color: wkd ? "#d29922" : "#6e7681" }}>{DN[dow]}</span>
                        <span style={{ fontSize: 12 }}>{ca ? (ca.tp === "head" ? "👑" : "★") : "⚠"}</span>
                        <span style={{ fontSize: 10, color: ca ? (ca.tp === "head" ? "#79c0ff" : "#e3b341") : "#f85149", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{ca ? ca.nm : "None"}</span>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* DAILY */}
        {view === "daily" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 10 }}>
            {Array.from({ length: WEEKS }, (_, w) => (
              <div key={w} style={{ background: "#161b22", borderRadius: 8, padding: 12, border: "1px solid #21262d" }}>
                <h3 style={{ fontSize: 11, fontWeight: 700, color: "#388bfd", marginBottom: 8 }}>Week {w + 1}</h3>
                {Array.from({ length: 7 }, (_, dow) => {
                  const d = w * 7 + dow;
                  const dd = daily[d];
                  const bl = dd.t < dd.mn;
                  const at = dd.t >= dd.tgt;
                  const wkd = dow === 0 || dow === 6;
                  const mx = dd.tgt + 4;
                  const bW = dd.t > 0 ? Math.min((dd.t / mx) * 100, 100) : 0;
                  const bC = bl ? "#f85149" : at ? "#3fb950" : "#d29922";
                  return (
                    <div key={dow} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                      <span style={{ width: 26, fontSize: 9, fontWeight: wkd ? 700 : 400, color: wkd ? "#d29922" : "#8b949e" }}>{DN[dow]}</span>
                      <div style={{ flex: 1, height: 14, background: "#0d1117", borderRadius: 3, overflow: "hidden", position: "relative" }}>
                        <div style={{ width: bW + "%", height: "100%", background: bC, borderRadius: 3 }} />
                        <div style={{ position: "absolute", left: (dd.tgt / mx) * 100 + "%", top: 0, bottom: 0, width: 1.5, background: "#484f58", opacity: 0.6 }} />
                      </div>
                      <span style={{ width: 18, textAlign: "right", fontSize: 10, fontWeight: 700, fontFamily: "monospace", color: bC }}>{dd.t}</span>
                      {dd.hh && <span style={{ fontSize: 8 }}>👑</span>}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        {/* CHANGES */}
        {view === "changes" && (
          <div style={{ maxWidth: 700 }}>
            {changes.length === 0 ? (
              <div style={{ textAlign: "center", padding: 36, color: "#484f58" }}>
                <p style={{ fontSize: 12 }}>No moves yet. Click <strong style={{ color: "#3fb950" }}>Balance</strong> after entering schedules.</p>
              </div>
            ) : (
              <div>
                <p style={{ fontSize: 12, color: "#8b949e", marginBottom: 14 }}>
                  <strong style={{ color: "#c9d1d9" }}>{changes.length}</strong> moves:
                </p>
                <div style={{ display: "grid", gap: 5, maxHeight: 450, overflowY: "auto" }}>
                  {changes.map((c, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 11px", background: "#161b22", borderRadius: 6, border: "1px solid #21262d", fontSize: 12 }}>
                      <span>↕</span>
                      <span style={{ flex: 1, color: "#c9d1d9" }}>
                        <strong>{fN[c.nurse] ? fN[c.nurse].name : ""}</strong>
                        <span style={{ color: "#6e7681" }}> from </span>
                        <span style={{ color: "#f85149" }}>{DNF[c.from % 7]} W{Math.floor(c.from / 7) + 1}</span>
                        <span style={{ color: "#6e7681" }}> → </span>
                        <span style={{ color: "#3fb950" }}>{DNF[c.to % 7]} W{Math.floor(c.to / 7) + 1}</span>
                      </span>
                    </div>
                  ))}
                </div>
                <div style={{ marginTop: 14, padding: "10px 12px", background: "#161b22", borderRadius: 6, border: "1px solid #21262d" }}>
                  <h4 style={{ fontSize: 10, fontWeight: 700, color: "#8b949e", marginBottom: 6, textTransform: "uppercase" }}>Move Fairness</h4>
                  <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                    {fN.map((n, i) => mc[i] > 0 ? (
                      <span key={i} style={{ fontSize: 10, color: "#c9d1d9", padding: "2px 7px", background: "#21262d", borderRadius: 4 }}>
                        {n.name}: <strong style={{ fontFamily: "monospace" }}>{mc[i]}</strong>
                      </span>
                    ) : null)}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* CONFIRM MODAL */}
      {confirm && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }} onClick={() => setConfirm(null)}>
          <div style={{ background: "#161b22", border: "1px solid #30363d", borderRadius: 12, padding: 24, maxWidth: 400, width: "90%" }} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontSize: 14, fontWeight: 700, color: "#f0f6fc", marginBottom: 8 }}>
              {confirm.tp === "cycle" ? "Start New Cycle?" : "Remove " + confirm.nm + "?"}
            </h3>
            <p style={{ fontSize: 12, color: "#8b949e", marginBottom: 16 }}>
              {confirm.tp === "cycle"
                ? "Clears all shifts but keeps names, charge settings, and staff structure."
                : "This removes " + confirm.nm + " and their schedule data."}
            </p>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button className="ab" onClick={() => setConfirm(null)} style={{ background: "#21262d", color: "#8b949e", border: "1px solid #30363d" }}>Cancel</button>
              <button className="ab" onClick={() => {
                if (confirm.tp === "cycle") newCycle();
                else if (confirm.tp === "rf") rmF(confirm.ix);
                else if (confirm.tp === "rw") rmW(confirm.ix);
              }} style={{ background: "#da3633", color: "#fff" }}>
                {confirm.tp === "cycle" ? "Start New" : "Remove"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <div style={{ padding: "12px 22px", borderTop: "1px solid #21262d", display: "flex", gap: 14, fontSize: 10, color: "#484f58", flexWrap: "wrap" }}>
        <span>🟢 Target ({TGT}+1)</span>
        <span>🟡 OK ({MN}+1)</span>
        <span>🔴 Under</span>
        <span>★ Charge</span>
        <span>👑 Head</span>
        <span>🔒 Locked</span>
        <span>🔶 Weekender</span>
        <span>Right-click to lock/unlock</span>
        <span style={{ marginLeft: "auto" }}>FT:18 · PT:12 · PRN:custom · 3Mon · 3Fri · 1Wknd · Saves to browser</span>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
